name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ PCIS2/develop ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          
      - name: Install Dart dependencies and generate files
        run: |
          # 1. Get packages
          flutter pub get
          # 2. Force project files (like Podfile) to be generated/updated
          # This is necessary because 'flutter create' is often needed to properly
          # generate the native project files on a clean CI environment.
          flutter create . 
          
      - name: Fix iOS Deployment Target 🚀
        run: |
          echo "Setting platform :ios to '15.0' in Podfile..."
          
          # 1. Ensure the platform line is UNCOMMENTED.
          # We look for the line starting with '#' followed by 'platform :ios' and remove the '#'
          sed -i '' 's/^# *platform :ios/platform :ios/' ios/Podfile
          
          # 2. Set the deployment version to 15.0.
          # We now look for the UNCOMMENTED line starting with 'platform :ios' and set the version.
          sed -i '' "s/^platform :ios, .*/platform :ios, '15.0'/" ios/Podfile
          
          # Verification: print the Podfile content to confirm the fix
          echo "--- Podfile content after fix ---"
          cat ios/Podfile
          echo "-----------------------------------"

      - name: Force Pod Install with Repo Update (Crucial) ⚙️
        # Change directory to 'ios' and run pod install with repository update.
        # This resolves most long-running or stuck pod install issues.
        run: |
          cd ios
          pod install --repo-update
        # Increase the step timeout to give CocoaPods enough time for the repository update
        # You may need to adjust this (e.g., from 10 to 15 or 20 minutes) based on past build history.
        timeout-minutes: 15

      - name: Build iOS release
        # The pods are now installed, so the build command will be much faster.
        # We also add a timeout here as a safety measure.
        run: flutter build ios --release --no-codesign
        timeout-minutes: 20

      - name: Create IPA and Upload artifact
        # Combine the IPA creation and upload artifact steps
        run: |
          # The Runner.app is located inside the Release-iphoneos directory
          APP_PATH="build/ios/iphoneos/Runner.app"
          
          if [ -d "$APP_PATH" ]; then
            cd build/ios/iphoneos
            mkdir Payload
            cp -r Runner.app Payload/
            zip -r app.ipa Payload
            
            echo "IPA created successfully."
          else
            echo "Error: Runner.app not found at expected path: $APP_PATH"
            exit 1
          fi
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/app.ipa
