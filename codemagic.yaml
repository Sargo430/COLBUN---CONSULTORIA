workflows:
  ios-release:
    name: iOS Release Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Ensure Podfile exists and set iOS 15
        script: |
          echo "🛠 Checking Podfile..."
          mkdir -p ios
          if [ ! -f "ios/Podfile" ]; then
            echo "Creating new Podfile..."
            echo "platform :ios, '15.0'" > ios/Podfile
            echo "" >> ios/Podfile
            echo "use_frameworks!" >> ios/Podfile
            echo "use_modular_headers!" >> ios/Podfile
            echo "" >> ios/Podfile
            echo "target 'Runner' do" >> ios/Podfile
            echo "  flutter_application_path = '../'" >> ios/Podfile
            echo "  eval(File.read(File.join(flutter_application_path, '.ios', 'Flutter', 'podhelper.rb')), binding)" >> ios/Podfile
            echo "end" >> ios/Podfile
          else
            echo "Updating existing Podfile..."
            sed -i.bak "s/platform :ios, '.*'/platform :ios, '15.0'/" ios/Podfile || echo "platform :ios, '15.0'" >> ios/Podfile


