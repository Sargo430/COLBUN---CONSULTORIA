workflows:
  ios-release:
    name: iOS Release Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Ensure Podfile exists and set iOS 15
        script: |
          echo "🛠 Checking Podfile..."
          mkdir -p ios
          if [ ! -f "ios/Podfile" ]; then
            echo "Creating new Podfile..."
            cat > ios/Podfile <<'PODFILE'
platform :ios, '15.0'

use_frameworks!
use_modular_headers!

target 'Runner' do
  flutter_application_path = '../'
  eval(File.read(File.join(flutter_application_path, '.ios', 'Flutter', 'podhelper.rb')), binding)
end
PODFILE
          else
            echo "Updating existing Podfile..."
            sed -i.bak "s/platform :ios, '.*'/platform :ios, '15.0'/" ios/Podfile || echo "platform :ios, '15.0'" >> ios/Podfile
          fi

      - name: Clean & get dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Build iOS release (no signing)
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app

    publishing:
      email:
        recipients:
          - your_email@example.com

