workflows:
  ios-release:
    name: iOS Release Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Ensure iOS Project Files Exist & Clean
        script: |
          flutter clean
          flutter pub get
          # Force project files to be created/updated. This is CRUCIAL for the Podfile structure.
          flutter create .
          
          echo "🛠 Fixing Podfile target to iOS 15.0..."
          # Use a more explicit sed pattern to find and replace the platform line.
          # The '' after -i is required for macOS 'sed'.
          # We use single quotes inside the main script block to ensure they are passed correctly.
          sed -i '' 's/^platform :ios, .*/platform :ios, '\''15.0'\''/' ios/Podfile
          
      - name: Build iOS release (no signing)
        script: |
          # flutter build ios automatically runs pod install and builds the app
          flutter build ios --release --no-codesign

# ... rest of workflow

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app

    publishing:
      email:
        recipients:
          - your_email@example.com
