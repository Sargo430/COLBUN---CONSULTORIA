workflows:
  ios-release: # 2 spaces
    name: iOS Release Build # 4 spaces
    environment: # 4 spaces
      flutter: stable # 6 spaces
      xcode: latest # 6 spaces
      cocoapods: default # 6 spaces

    scripts:
      - name: Ensure iOS Project Files Exist & Set iOS 15
        script: |
          # 1. Clean and get dependencies (Ensures Podfile is created/updated by Flutter)
          flutter clean
          flutter pub get
          flutter create . # Re-runs project file generation
          
          echo "🛠 Setting Podfile platform to iOS 15.0..."
          
          # 2. **CRITICAL FIX**: Use sed to replace the deployment target. 
          # The '^' ensures we only match the line starting with 'platform :ios,'.
          # The -i '' is necessary for 'sed' on the macOS build machine.
          # We use double-quotes around the whole command for safer escaping.
          sed -i '' "s/^platform :ios, .*/platform :ios, '15.0'/" ios/Podfile
          
          # 3. Optional: Verify the change (will print the updated line)
          grep "platform :ios" ios/Podfile
          
      - name: Build iOS release (no signing)
        script: |
          # flutter build ios now runs pod install with the correct iOS 15.0 target
          flutter build ios --release --no-codesign

    artifacts: # 4 spaces
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app

    publishing: # 4 spaces
      email: # 6 spaces
        recipients: # 8 spaces
          - your_email@example.com # 10 spaces
